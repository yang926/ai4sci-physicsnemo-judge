[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4sci-physicsnemo-judge"
version = "0.1.0"
description = "Local pilot judge and projector leaderboard for the AI4Science Korea PhysicsNeMo workshop"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["sympy>=1.14,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "PyYAML>=6", "websocket-client>=1.8"]

[project.scripts]
ai4sci-judge = "ai4sci_judge.__main__:main"

[tool.setuptools.packages.find]
include = ["ai4sci_judge*"]

[tool.setuptools.package-data]
ai4sci_judge = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
